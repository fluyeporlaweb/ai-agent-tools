name: Tool proposal
description: Propose a new tool for the monorepo.
title: "[Tool]: "
labels: ["tool proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/fluyeporlaweb/agent-tools/blob/main/CONTRIBUTING.md) before submitting. Wait for a maintainer to agree on the scope before writing code.
  - type: input
    id: name
    attributes:
      label: Tool name
      description: Lowercase, with hyphens.
      placeholder: mcp-example
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - MCP server
        - Agent skill
        - Script
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What it does
      description: One or two sentences. Who is it for?
    validations:
      required: true
  - type: input
    id: existing
    attributes:
      label: Existing repo or prototype
      description: Link to code, a demo or related work, if any.
  - type: textarea
    id: why
    attributes:
      label: Why this monorepo
      description: Why does it belong here instead of a standalone repository?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the tools table before proposing this.
          required: true
        - label: I am willing to open a pull request for this tool.
